<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="badge-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="50%" stop-color="#0F131D"/>
      <stop offset="100%" stop-color="#080A0F"/>
    </linearGradient>
    <linearGradient id="cobalt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="60%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Container with Cobalt Rim -->
  <rect width="64" height="64" rx="16" fill="url(#badge-bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.45"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.08"/>

  <!-- Top-Right Signature 4-Point Star ✦ -->
  <g filter="url(#glow)">
    <path d="M 52 7 Q 52 13 58 13 Q 52 13 52 19 Q 52 13 46 13 Q 52 13 52 7 Z" fill="url(#gold-grad)"/>
    <circle cx="52" cy="13" r="1.3" fill="#FFFFFF"/>
  </g>

  <!-- Monogram CTS: Chaos (White) To (Gold) Solution (Cobalt) -->
  <g transform="translate(1, 0)">
    <!-- Letter C (Crisp Off-White) -->
    <path d="M 21.5 24.5
             C 19.8 21.8 16.8 20 13 20
             C 7 20 2.5 25.2 2.5 32
             C 2.5 38.8 7 44 13 44
             C 16.8 44 19.8 42.2 21.5 39.5
             L 17 36.8
             C 16 38.2 14.5 39.2 12.8 39.2
             C 9.2 39.2 7.2 36 7.2 32
             C 7.2 28 9.2 24.8 12.8 24.8
             C 14.5 24.8 16 25.8 17 27.2
             Z"
          fill="#F8FAFC"
          transform="translate(4, 0)"/>

    <!-- Letter T (Sunny Gold / Electric Yellow) -->
    <path d="M 23.5 20.5
             L 38.5 20.5
             L 38.5 25.5
             L 33.5 25.5
             L 33.5 43.5
             L 28.5 43.5
             L 28.5 25.5
             L 23.5 25.5
             Z"
          fill="url(#gold-grad)"
          transform="translate(1, 0)"/>

    <!-- Letter S (Cobalt Solution Blue) -->
    <path d="M 40.5 39
             C 41.8 40.8 43.8 42 46.5 42
             C 49.5 42 51.5 40.2 51.5 37.8
             C 51.5 33.5 41 33.8 41 27.2
             C 41 22.8 44.8 20 49 20
             C 51.8 20 54.2 21.2 55.8 23.2
             L 52.5 26.5
             C 51.5 25.2 50.2 24.5 48.8 24.5
             C 46.8 24.5 45.5 25.5 45.5 27
             C 45.5 30.5 56 30.2 56 37.5
             C 56 42.5 52 44.5 46.5 44.5
             C 43 44.5 40 43 37.5 40.5
             Z"
          fill="url(#cobalt-grad)"
          transform="translate(-1, 0)"/>
  </g>
</svg>