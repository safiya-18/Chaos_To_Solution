services:
  - type: web
    name: cts-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        value: https://cts.vercel.app,https://ctschallenge.vercel.app,http://localhost:5173
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: AI_TIMEOUT_MS
        value: "4000"
      - key: EVENT_ID
        value: cts-2026
      - key: EVENT_TIMER_DURATION_MS
        value: "14400000"
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: EVENT_ADMIN_TOKEN
        sync: false
